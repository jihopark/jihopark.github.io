---
layout: page
title: Tags
permalink: /tag/
---

<div class="page">
  <h1 class="page-title">Tags</h1>
  <ul>
    {% assign tags = site.tags | sort %}
    {% for tag in tags %}
      {% assign tag_name = tag[0] %}
      <li><a href="/tag/{{ tag_name | slugify }}/">{{ tag_name }} ({{ tag[1].size }})</a></li>
    {% endfor %}
  </ul>
</div>
