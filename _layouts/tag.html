---
layout: default
---

<div class="page">
  <h1 class="page-title">Tag: {{ page.tag }}</h1>
  <ul class="post-list">
    {% assign tag_posts = site.tags[page.tag] %}
    {% if tag_posts %}
      {% for post in tag_posts %}
      <li>
        <a href="{{ post.url }}">{{ post.title }}</a>
        <small>{{ post.date | date_to_string }}</small>
      </li>
      {% endfor %}
    {% else %}
      <li>No posts found.</li>
    {% endif %}
  </ul>
</div>
